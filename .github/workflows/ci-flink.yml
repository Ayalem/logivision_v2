name: CI — Flink Jobs

on:
  push:
    branches: [develop, main]
    paths:
      - "services/flink-jobs/**"
      - "infra/kafka/schemas/**"
  pull_request:
    paths:
      - "services/flink-jobs/**"
      - "infra/kafka/schemas/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fastavro confluent-kafka numpy pytest-asyncio

      - name: Run tests
        run: |
          cd services/flink-jobs
          PYTHONPATH=.:../.. pytest tests/ -v

      - name: Validate Avro schemas
        run: |
          python -c "
          import json
          import fastavro
          for name in ['Detection', 'Event', 'RawFrame', 'Track']:
              with open(f'infra/kafka/schemas/{name}.avsc') as f:
                  schema = json.load(f)
              fastavro.parse_schema(schema)
              print(f'✓ {name}.avsc valid')
          "

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Flink jobs image
        run: |
          docker build -t logivision-flink-jobs:${{ github.sha }} services/flink-jobs/

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: logivision-flink-jobs:${{ github.sha }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          trivyignores: .trivyignore
