services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logivision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logivision}
      POSTGRES_DB: ${POSTGRES_DB:-logivision}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logivision}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logivision-net

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      # Read the names .env actually defines (MINIO_ROOT_USER/PASSWORD) so the
      # MinIO server, MLflow, and the pipeline services all share one set of
      # credentials. Previously this read MINIO_ACCESS_KEY (not in .env), so
      # MinIO booted as minioadmin while services used `logivision` → S3
      # InvalidAccessKeyId on every frame upload.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logivision-net

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-logivision}:${POSTGRES_PASSWORD:-logivision}@postgres:5432/${POSTGRES_DB:-logivision}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://mlflow/
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    # The base image has no default server command, and lacks the Postgres
    # + S3 drivers. Install them, then serve with the Postgres backend store
    # and MinIO (s3://) artifact root. $$VAR defers expansion to the
    # container shell so it reads the env vars defined above.
    command: >
      sh -c "pip install --quiet --no-cache-dir psycopg2-binary boto3 &&
      exec mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri $${MLFLOW_BACKEND_STORE_URI}
      --default-artifact-root $${MLFLOW_DEFAULT_ARTIFACT_ROOT}"
    ports:
      # Host 5050 → container 5000: the whole project expects MLflow at
      # http://localhost:5050 (resolve_model_weights default, notebooks,
      # ONBOARDING), and host 5000 collides with macOS AirPlay Receiver.
      - "5050:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - logivision-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      # Host 9100 → container 9000: MinIO already owns host 9000 (S3 API).
      # ClickHouse's native port stays 9000 inside the compose network
      # (peers connect via `clickhouse:9000`); only the host mapping moves.
      - "9100:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logivision-net

  # Optional: pgadmin for debugging
  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@logivision.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      # Host 5051 → container 80: MLflow owns host 5050 (the URL all the
      # code + docs use). pgAdmin is an optional debug UI, so it moves.
      - "5051:80"
    depends_on:
      - postgres
    networks:
      - logivision-net

volumes:
  postgres_data:
  minio_data:
  clickhouse_data:

networks:
  logivision-net:
    driver: bridge
