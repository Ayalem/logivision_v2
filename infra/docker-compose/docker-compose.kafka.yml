name: logivision-kafka

services:

  kafka:
    image: apache/kafka:3.8.0
    container_name: logivision-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - logivision-kafka-net

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: logivision-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        K=/opt/kafka/bin/kafka-topics.sh
        BS=kafka:9094
        echo "Creating topics..."
        $$K --bootstrap-server $$BS --create --if-not-exists --topic raw-frames    --partitions 6 --replication-factor 1 --config retention.ms=3600000  --config cleanup.policy=delete
        $$K --bootstrap-server $$BS --create --if-not-exists --topic detections    --partitions 6 --replication-factor 1 --config retention.ms=86400000 --config cleanup.policy=delete
        $$K --bootstrap-server $$BS --create --if-not-exists --topic tracks        --partitions 6 --replication-factor 1 --config retention.ms=86400000 --config cleanup.policy=delete
        $$K --bootstrap-server $$BS --create --if-not-exists --topic events        --partitions 3 --replication-factor 1 --config retention.ms=604800000 --config cleanup.policy=compact
        $$K --bootstrap-server $$BS --create --if-not-exists --topic model-drift   --partitions 1 --replication-factor 1 --config retention.ms=2592000000 --config cleanup.policy=delete
        echo "Topics:" && $$K --bootstrap-server $$BS --list
    networks:
      - logivision-kafka-net

  schema-registry:
    image: apicurio/apicurio-registry-mem:2.6.5.Final
    container_name: logivision-apicurio
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      QUARKUS_PROFILE: prod
      REGISTRY_KAFKA_COMMON_BOOTSTRAP_SERVERS: kafka:9094
    networks:
      - logivision-kafka-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: logivision-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8086:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: logivision
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8080/apis/registry/v2
    networks:
      - logivision-kafka-net

  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    container_name: logivision-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "9997:9997"
    volumes:
      - ../mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - logivision-kafka-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9997/v3/paths/list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  kafka-data:
    name: logivision-kafka-data

networks:
  logivision-kafka-net:
    name: logivision-kafka-net
    driver: bridge
