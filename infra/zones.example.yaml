# Example zones file consumed by services/stream_processor/cep.py and
# served (read-only) at GET /api/zones for the warehouse dashboard.
#
# Coordinates are normalised (0..1) relative to the image size; the
# Digital Twin renders them directly. Each polygon is a list of vertices,
# closed automatically.
#
# `kind` controls which CEP event fires when a track lands in the zone:
#   entry      → emit `entry` event (info)         → "Entrées" KPI
#   exit       → emit `exit`  event (info)         → "Sorties" KPI
#   forbidden  → emit `zone_violation` (critical)  → anomalies feed
#   shelf      → no event; passive zone for occupancy aggregates
#
# `forbidden: true` (legacy) is still honored — it maps to `kind: forbidden`.
#
# `capacity` (optional, default 10) is the track-count capacity used by the
# CEP's zone-occupancy snapshots: ratio = min(1, occupied_tracks/capacity).
# The congestion LSTM consumes these bounded 0..1 ratios.

zones:
  - name: entrance_dock
    capacity: 6
    kind: entry
    category: Réception
    polygon:
      - {x: 0.00, y: 0.00}
      - {x: 0.25, y: 0.00}
      - {x: 0.25, y: 0.20}
      - {x: 0.00, y: 0.20}

  - name: exit_dock
    capacity: 6
    kind: exit
    category: Expédition
    polygon:
      - {x: 0.75, y: 0.00}
      - {x: 1.00, y: 0.00}
      - {x: 1.00, y: 0.20}
      - {x: 0.75, y: 0.20}

  - name: shelf_A1
    capacity: 12
    kind: shelf
    category: Stockage
    polygon:
      - {x: 0.05, y: 0.30}
      - {x: 0.30, y: 0.30}
      - {x: 0.30, y: 0.55}
      - {x: 0.05, y: 0.55}

  - name: shelf_A2
    capacity: 12
    kind: shelf
    category: Stockage
    polygon:
      - {x: 0.35, y: 0.30}
      - {x: 0.60, y: 0.30}
      - {x: 0.60, y: 0.55}
      - {x: 0.35, y: 0.55}

  - name: shelf_A3
    capacity: 12
    kind: shelf
    category: Stockage
    polygon:
      - {x: 0.05, y: 0.60}
      - {x: 0.30, y: 0.60}
      - {x: 0.30, y: 0.85}
      - {x: 0.05, y: 0.85}

  - name: shelf_A4
    capacity: 12
    kind: shelf
    category: Stockage
    polygon:
      - {x: 0.35, y: 0.60}
      - {x: 0.60, y: 0.60}
      - {x: 0.60, y: 0.85}
      - {x: 0.35, y: 0.85}

  - name: forbidden_aisle
    capacity: 4
    kind: forbidden
    category: Restreint
    polygon:
      - {x: 0.70, y: 0.30}
      - {x: 0.95, y: 0.30}
      - {x: 0.95, y: 0.85}
      - {x: 0.70, y: 0.85}
