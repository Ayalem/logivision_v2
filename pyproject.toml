[project]
name = "logivision"
version = "0.1.0"
description = "LOGIVISION — Intelligent warehouse surveillance with Computer Vision MLOps."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{ name = "Ayalem", email = "ayalemzouri9@gmail.com" }]
dependencies = [
    "pyzbar>=0.1.9",
    "qrcode>=8.2",
    "supervision>=0.28.0",
    "trackers>=2.4.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.7.0,<0.8.0",
    "mypy>=1.13.0,<1.14.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "detect-secrets>=1.5.0,<2.0.0",
    "requests>=2.32.0,<3.0.0",
    "dvc[s3]>=3.55.0,<4.0.0",
    "kaggle>=1.8.4",
]
ml = [
    "bentoml>=1.3.0,<2",
    "boto3>=1.35.0,<2.0.0",
    "confluent-kafka>=2.5.0,<3",
    "evidently>=0.4.0,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "kaggle>=1.6.0,<2",
    "mlflow>=2.17.0,<3.0.0",
    "nncf>=2.13.0,<3",
    "numpy>=1.26.0,<3.0.0",
    "opencv-python-headless>=4.10.0,<5.0.0",
    "openvino>=2024.4.0,<2025",
    "pillow>=10",
    "pyyaml>=6.0.0,<7.0.0",
    "torch>=2.4.0,<3.0.0",
    "ultralytics>=8.3.0,<9.0.0",
    "uvicorn[standard]>=0.30,<1",
]

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ml/notebooks", "**/migrations/**"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- mypy ----------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
exclude = [
    "ml/scripts/",
    "ml/notebooks/",
    "ml/pipelines/",
    "scripts/",
    "services/",
    "tests/load/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = ["ml.scripts.*", "ml.pipelines.*", "ml.tests.*"]
ignore_errors = true

# ---------- pytest ----------
[tool.pytest.ini_options]
minversion = "8.3"
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config -m 'not integration'"
testpaths = [
    "tests",
    "ml/tests",
    "services/model_server/tests",
    "services/inference_worker/tests",
    "services/frame_grabber/tests",
    # services/flink-jobs/tests is intentionally NOT here — those tests
    # need PyFlink (JVM-heavy) and have their own dedicated CI workflow
    # (.github/workflows/ci-flink.yml). Running them here would force
    # every backend dev to install ~1 GB of JVM deps.
    "services/qr_decoder/tests",
    "services/stream_processor/tests",
    "services/api/tests",
]
pythonpath = ["."]
markers = [
    "integration: requires the MLOps stack to be running (see scripts/bootstrap.sh)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["services", "ml"]
omit = ["**/tests/**", "**/__init__.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
